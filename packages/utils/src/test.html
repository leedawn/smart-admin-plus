<div id="app">
  <input id="input" />
</div>
<script>
  function debounce(fn, delay) {
    let timer = null;
    return (...args) => {
      const context = this;
      clearTimeout(timer);
      timer = setTimeout(() => {
        fn.apply(context, args);
      }, delay);
    };
  }
  const input = document.getElementById("input");
  const print = () => {
    console.log("wow");
  };

  const debouncedPrint = debounce(print, 600);

  input.addEventListener("input", debouncedPrint);
</script>
